name: Check playable content creation
on:
  pull_request:
  push:
    branches: [main, beta]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-battle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v6
        with:
          repository: pret/pokered
          ref: d2704a63c26f9ba046ade877445216b3de0519a4
          path: .content-fixtures/pokered
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: pret/pokeyellow
          ref: e89ead154b9968aa50eed9328ff2b38b6c194382
          path: .content-fixtures/pokeyellow
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: binji/binjgb
          ref: 8abd0d38d5bf109d7c280b27d815a8b53168adde
          path: .content-fixtures/binjgb
          persist-credentials: false
      - name: Install pinned RGBDS
        run: |
          mkdir -p .content-fixtures/rgbds
          curl --fail --location --output .content-fixtures/rgbds.tar.xz https://github.com/gbdev/rgbds/releases/download/v1.0.4/rgbds-linux-x86_64.tar.xz
          echo "3e19e50ea602e316be709160acaf0a708b1fa6d32d219ec541f244442895dbb7  .content-fixtures/rgbds.tar.xz" | sha256sum --check
          tar --no-same-owner -xf .content-fixtures/rgbds.tar.xz -C .content-fixtures/rgbds
      - name: Check creation transactions and stable identities
        run: npm run test:content -- .content-fixtures/pokered .content-fixtures/pokeyellow
      - name: Play new moves, trainer parties and species through capture, PC storage and save/reload
        run: npm run test:content:gameplay -- .content-fixtures/pokered .content-fixtures/pokeyellow --rom .content-fixtures/rgbds .content-fixtures/binjgb
      - run: npm exec playwright -- install --with-deps chromium
      - name: Create playable content through the application UI
        run: npm run test:content:ui -- .content-fixtures/pokered .content-fixtures/pokeyellow
        env:
          CONTENT_SCREENSHOT: content-creation.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-creation-preview
          path: content-creation.png
