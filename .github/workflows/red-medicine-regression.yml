name: Reproduce Red medicine evolution build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-medicine-evolution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Yellow Editor
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Yellow Editor dependencies
        run: npm ci

      - name: Checkout pinned pret/pokered
        run: |
          git clone https://github.com/pret/pokered.git pokered
          git -C pokered checkout a1a22aaf84d1675bcdbaeb194592379d586d838e

      - name: Install RGBDS 1.0.3
        run: |
          sudo apt-get update
          sudo apt-get install -y bison libpng-dev pkg-config
          git clone --depth 1 --branch v1.0.3 https://github.com/gbdev/rgbds.git rgbds
          sudo make -C rgbds -j"$(nproc)" install

      - name: Apply Yellow Editor Potion evolution patch
        run: |
          ./node_modules/.bin/esbuild scripts/repro-red-medicine-evolution.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=/tmp/repro-red-medicine-evolution.mjs
          node /tmp/repro-red-medicine-evolution.mjs "$GITHUB_WORKSPACE/pokered"

      - name: Build modified Pokémon Red
        run: make -C pokered -j"$(nproc)" pokered.gbc
