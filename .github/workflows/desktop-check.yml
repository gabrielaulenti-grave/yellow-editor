name: Check desktop app

on:
  push:
    branches: ["main", "beta"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm exec tsc -- --noEmit

      - name: Check script round trips
        run: npm run test:scripts

      - name: Check Pages channel packaging
        run: npm run test:pages

      - name: Install layout-check browser
        run: npm exec playwright -- install --with-deps chromium

      - name: Check script editor layouts
        run: npm run test:scripts:layout

      - name: Check NPC creation workflow
        run: npm run test:npcs:ui

      - name: Checkout Yellow script fixtures
        uses: actions/checkout@v6
        with:
          repository: pret/pokeyellow
          ref: e89ead154b9968aa50eed9328ff2b38b6c194382
          path: .script-fixtures/pokeyellow
          persist-credentials: false

      - name: Checkout Red and Blue script fixtures
        uses: actions/checkout@v6
        with:
          repository: pret/pokered
          ref: d2704a63c26f9ba046ade877445216b3de0519a4
          path: .script-fixtures/pokered
          persist-credentials: false

      - name: Check native map objects, vanilla coverage and edit history
        run: npm run test:maps:native -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check native map object editing on mobile and desktop
        run: npm run test:maps:native:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check imported map source analysis and independent field editing
        run: npm run test:maps:imported -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Edit imported hacks on mobile and desktop
        env:
          IMPORTED_MAP_OBJECTS: "1"
        run: npm run test:maps:native:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check independent map creation and undoable file lifecycle
        run: npm run test:maps:create -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check new map creation through Maps
        run: npm run test:maps:create:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check new-map encounters, item pickups, atomic history and source guards
        run: npm run test:maps:populate -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check encounter assignment and item placement through Maps
        run: npm run test:maps:populate:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check field tool items, table extension, map permissions and atomic history
        run: npm run test:items:field -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check field tool authoring at mobile and desktop widths
        run: npm run test:items:field:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check native trainer placement, independent parties and history
        run: npm run test:maps:trainers -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check trainer placement and editing through Maps
        run: npm run test:maps:trainers:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check map terrain and warp sources, binary history and Save As
        run: npm run test:maps:edit -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check map terrain and warp editing through Maps
        run: npm run test:maps:edit:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check Strength puzzles, map permissions and history
        run: npm run test:maps:strength -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check Strength puzzle and map property editors
        run: npm run test:maps:strength:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check NPC conditions, visibility, services and history
        run: npm run test:npcs:tools -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check NPC condition and service authoring through Maps
        run: npm run test:npcs:tools:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check scene drafts, stationary sprites and diagnostics
        run: npm run test:scenes:readiness:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check following partner authoring in Maps
        run: npm run test:scenes:partner:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check following partner source contracts and authoring
        run: npm run test:scenes:partner -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check shared scene flags, linked rewards and map-local logic
        run: npm run test:scenes:choices:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check position branches and facing controls
        run: npm run test:scenes:position:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check multiple scene starts and alternate routes
        run: npm run test:scenes:starts -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check walking scene authoring in Maps
        run: npm run test:scenes:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check disassembly script round trips
        run: npm run test:scripts -- .script-fixtures/pokeyellow .script-fixtures/pokered

      - name: Check reusable interaction composition and source guards
        run: npm run test:interactions -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check existing NPC editing and scene preservation
        run: npm run test:npcs:edit -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check NPC editing through Maps
        run: npm run test:npcs:edit:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check walking scene sources and guards
        run: npm run test:scenes -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check music, fades and encounter authoring in Maps
        run: npm run test:scenes:effects:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check sign and NPC dialogue editing through Scripts
        run: npm run test:dialogue:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Check NPC and sign interaction editing through Maps
        run: npm run test:maps:interactions -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Checkout script probe CPU
        uses: actions/checkout@v6
        with:
          repository: binji/binjgb
          ref: 8abd0d38d5bf109d7c280b27d815a8b53168adde
          path: .script-fixtures/binjgb
          persist-credentials: false

      - name: Install pinned native RGBDS
        run: |
          mkdir -p .script-fixtures/rgbds
          curl --fail --location --output .script-fixtures/rgbds.tar.xz https://github.com/gbdev/rgbds/releases/download/v1.0.4/rgbds-linux-x86_64.tar.xz
          echo "3e19e50ea602e316be709160acaf0a708b1fa6d32d219ec541f244442895dbb7  .script-fixtures/rgbds.tar.xz" | sha256sum --check
          tar --no-same-owner -xf .script-fixtures/rgbds.tar.xz -C .script-fixtures/rgbds

      - name: Compile independent maps and verify registry and warp records
        run: npm run test:maps:create -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds

      - name: Compile new houses and verify map and warp bytes in ROM
        run: npm run test:maps:edit -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds

      - name: Compile populated new maps and test pickup persistence on the CPU
        run: npm run test:maps:populate -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds .script-fixtures/binjgb

      - name: Compile field tools, execute banked probes and play native item menus
        run: npm run test:items:field -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds .script-fixtures/binjgb

      - name: Compile trainer maps and execute native battle dispatcher probes
        run: npm run test:maps:trainers -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds .script-fixtures/binjgb

      - name: Play trainer sight, talk challenges, blackout and battery reloads
        run: npm run test:maps:trainers:gameplay -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds .script-fixtures/binjgb

      - name: Execute Strength and field permission CPU probes and compile edited ROMs
        run: npm run test:maps:strength -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds .script-fixtures/binjgb

      - name: Compile edited native map objects and execute native battle and pickup probes
        run: npm run test:maps:native -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds .script-fixtures/binjgb

      - name: Compile independently modified Red and Yellow source projects after edits
        run: npm run test:maps:imported -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds

      - name: Execute NPC condition, payment and visibility probes and compile edited ROMs
        run: npm run test:npcs:tools -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds .script-fixtures/binjgb

      - name: Check repeated item gifts and inventory map boundaries
        run: npm run test:items:gifts -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds .script-fixtures/binjgb

      - name: Assemble edited ROMs and execute script probes
        run: npm run test:scripts:rom -- .script-fixtures/rgbds .script-fixtures/binjgb .script-fixtures/pokeyellow .script-fixtures/pokered

      - name: Check reviewed script engine contracts on the CPU
        run: npm run test:scripts:contracts -- .script-fixtures/rgbds .script-fixtures/binjgb .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Assemble and execute composed interactions in Red and Yellow
        run: npm run test:interactions -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds .script-fixtures/binjgb

      - name: Assemble and execute walking scenes in Red and Yellow
        run: npm run test:scenes -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds .script-fixtures/binjgb

      - name: Play native encounters and reload battery saves in Red and Yellow
        run: npm run test:scenes:gameplay -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds .script-fixtures/binjgb

      - name: Play native Yellow partner movement and absence
        run: npm run test:scenes:partner -- .script-fixtures/pokeyellow --rom .script-fixtures/rgbds .script-fixtures/binjgb

      - name: Assemble and execute linked fossil scenes
        run: npm run test:scenes:choices -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds .script-fixtures/binjgb

      - name: Play complete native fossil quests and reload battery saves
        run: npm run test:scenes:choices:gameplay -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds .script-fixtures/binjgb

      - name: Assemble and execute multi-start scenes in Red and Yellow
        run: npm run test:scenes:starts -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds .script-fixtures/binjgb

      - name: Assemble relocated NPCs and following scenes in Red and Yellow
        run: npm run test:npcs:edit -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds

      - name: Assemble and execute the PC lesson regression scenario
        run: npm run test:pc-tutorial -- .script-fixtures/pokered .script-fixtures/pokeyellow --rom .script-fixtures/rgbds .script-fixtures/binjgb

      - name: Check PC lesson fixture editing and atomic undo in the browser
        run: npm run test:pc-tutorial:ui -- .script-fixtures/pokered .script-fixtures/pokeyellow

      - name: Prepare shared WASM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bison ninja-build
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .emsdk
          ./.emsdk/emsdk install 4.0.15
          ./.emsdk/emsdk activate 4.0.15
          source ./.emsdk/emsdk_env.sh
          npm run prepare:rgbds-wasm
          npm run prepare:shared-wasm-dev

      - name: Prepare emulator WASM
        run: npm run prepare:emulator-wasm

      - name: Check desktop frontend
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
